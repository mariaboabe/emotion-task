<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion categorization task</title>
<style>
  :root { --bg:#2b2e36; --panel:#363a45; --btn:#454a58; --btn-hover:#555b6b; --text:#eceef2; --muted:#a9aebb; --accent:#8ab4f8; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .text { max-width:640px; width:100%; }
  h1 { font-size:1.5rem; margin:0 0 .8em; font-weight:650; }
  p { margin:0 0 1em; }
  .muted { color:var(--muted); font-size:.92rem; }
  button { font:inherit; color:var(--text); background:var(--btn); border:1px solid #5f6575; border-radius:6px; padding:.6em 1.2em; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--btn-hover); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:#3b5a8f; border-color:#5b7fb9; }
  button.primary:hover:not(:disabled) { background:#4a6ca6; }
  .consent { background:var(--panel); padding:16px 20px; border-radius:8px; max-height:50vh; overflow:auto; margin-bottom:1em; }
  label.check { display:flex; gap:.6em; align-items:flex-start; margin-bottom:1em; }
  /* trial screen */
  #trial { width:100%; height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px; margin:-24px; }
  #stage { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  #fix { font-size:3rem; color:var(--muted); }
  #buttons { display:flex; gap:12px; padding:12px 0 4px; flex-wrap:wrap; justify-content:center; }
  #buttons button { min-width:130px; padding:.7em 1em; display:flex; flex-direction:column; align-items:center; line-height:1.25; }
  #buttons small { color:var(--muted); font-size:.78rem; }
  .scale { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:12px 0; }
  .scale button { min-width:46px; }
  .ends { display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; max-width:560px; margin:0 auto; }
  .rate img { max-height:55vh; max-width:100%; display:block; margin:0 auto 8px; }
  .iri-item { background:var(--panel); border-radius:8px; padding:12px 16px; margin-bottom:10px; }
  .iri-item p { margin:0 0 .5em; }
  .iri-opts { display:flex; gap:18px; flex-wrap:wrap; }
  .iri-opts label { display:flex; gap:.35em; align-items:center; cursor:pointer; }
  .bar { height:8px; background:var(--panel); border-radius:4px; overflow:hidden; margin:12px 0; }
  .bar > div { height:100%; width:0; background:var(--accent); }
  .warn { color:#f2b8b5; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ CONFIG ============================ */
const CONFIG = {
  STIM_DIR: "stimuli/",
  NEUTRAL: { robot: "neutral.png", human: "human neutral.png" },   // <-- EDIT to match your two neutral image file names exactly
  DATAPIPE_ID: "",          // paste your DataPipe experiment ID here (OSF). Leave "" to fall back to manual CSV download (testing).
  FIXATION_MS: 500,
  ITI_MS: 400,
  MAX_RT_MS: null,          // null = self-paced; e.g. 4000 to time out trials
  BREAK_EVERY: 36,          // rest screen after this many trials within a block
  CONGRUENT_REPS: 9,
  INCONGRUENT_REPS: 3,
  KEYS: ["d", "f", "j", "k"],
  STUDY_TITLE: "Emotion categorization task"
};

// Replace with the ethics-approved consent text.
const CONSENT_HTML = `
  <p>[Insert approved information sheet and consent text here.]</p>
`;

/* ============================ STATE ============================ */
const params = new URLSearchParams(location.search);
const DEV = params.has("dev");   // ?dev draws placeholder images for any missing file
const EMO = { A:"anger", F:"fear", S:"sadness", H:"happiness" };
const CODES = ["A","F","S","H"];
const KEY_ORDER = shuffle(CODES.slice());             // response order left-to-right, fixed within participant
const PID = params.get("pid") || ("P" + Math.random().toString(36).slice(2, 8).toUpperCase());
const AGENT_ORDER = params.get("order") === "human" ? ["human","robot"]
                  : params.get("order") === "robot" ? ["robot","human"]
                  : shuffle(["robot","human"]);
const data = { trials: [], trust: {}, trustOrder: [], iri: {}, meta: { pid: PID, agent_order: AGENT_ORDER.join(">"), key_order: KEY_ORDER.map(c=>EMO[c]).join("|"),
  started: new Date().toISOString(), screen: screen.width+"x"+screen.height, viewport: innerWidth+"x"+innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent, blur_events: 0 } };
document.addEventListener("visibilitychange", () => { if (document.hidden) data.meta.blur_events++; });

/* ============================ HELPERS ============================ */
const app = document.getElementById("app");
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(html){ app.innerHTML = html; window.scrollTo(0,0); }
function waitClick(id){ return new Promise(res => document.getElementById(id).addEventListener("click", res, { once:true })); }

// Naming: robot = "AB FF 1.png", human = "human AB FF 1.png" (body, face, repetition; spaces, not underscores)
function fileName(agent, b, f, rep){ return (agent==="human" ? "human " : "") + `${b}B ${f}F ${rep}.png`; }
function makeStimuli(agent){
  const out = [];
  for (const b of CODES) for (const f of CODES) {
    const congruent = b === f, n = congruent ? CONFIG.CONGRUENT_REPS : CONFIG.INCONGRUENT_REPS;
    for (let r=1; r<=n; r++) out.push({ agent, body:b, face:f, rep:r, congruent, file:fileName(agent,b,f,r) });
  }
  return out;
}

/* ============================ IMAGE PRELOAD ============================ */
const imgCache = {};
function placeholder(name){
  const c = document.createElement("canvas"); c.width = 740; c.height = 680;
  const g = c.getContext("2d"); g.fillStyle = "#3d414d"; g.fillRect(0,0,c.width,c.height);
  g.fillStyle = "#cfd3dc"; g.font = "28px sans-serif"; g.textAlign = "center"; g.fillText("PLACEHOLDER", 370, 320); g.fillText(name, 370, 365);
  return c.toDataURL();
}
function loadImg(name){
  return new Promise(res => {
    const im = new Image();
    im.onload = async () => { try { await im.decode(); } catch(e){} imgCache[name] = im; res(true); };
    im.onerror = () => { if (DEV) { const p = new Image(); p.onload = () => { imgCache[name] = p; res(true); }; p.src = placeholder(name); } else res(false); };
    im.src = CONFIG.STIM_DIR + encodeURIComponent(name);
  });
}
let progress = { done:0, total:0 }, missing = [];
function preloadAll(){
  const names = [...makeStimuli("robot"), ...makeStimuli("human")].map(s => s.file).concat(Object.values(CONFIG.NEUTRAL));
  progress.total = names.length;
  return Promise.all(names.map(n => loadImg(n).then(ok => { progress.done++; if(!ok) missing.push(n); const b=document.getElementById("pbar"); if(b) b.style.width = (100*progress.done/progress.total)+"%"; })));
}
const preloadPromise = preloadAll();

/* ============================ SCREENS ============================ */
async function consent(){
  show(`<div class="text"><h1>${CONFIG.STUDY_TITLE}</h1><div class="consent">${CONSENT_HTML}</div>
    <label class="check"><input type="checkbox" id="agree"> <span>I have read the information above and agree to take part.</span></label>
    <button class="primary" id="go" disabled>Continue</button></div>`);
  const cb = document.getElementById("agree"), go = document.getElementById("go");
  cb.addEventListener("change", () => go.disabled = !cb.checked);
  await waitClick("go");
  data.meta.consent_time = new Date().toISOString();
}

async function instructions(){
  const btns = KEY_ORDER.map((c,i)=>`<button disabled style="display:flex;flex-direction:column;align-items:center;min-width:110px">${EMO[c]}<small class="muted">${CONFIG.KEYS[i].toUpperCase()}</small></button>`).join("");
  show(`<div class="text"><h1>Instructions</h1>
    <p>On each trial you will see a figure that shows an emotion. Report the emotion shown by the <strong>face</strong>: anger, fear, sadness or happiness. Ignore the body.</p>
    <p>Respond as quickly and accurately as you can, using the keys below or by clicking the buttons. The positions stay the same throughout the task.</p>
    <div style="display:flex;gap:12px;justify-content:center;margin:1.2em 0">${btns}</div>
    <p class="muted">The task has two parts with a short rest in between. Keep this window in the foreground and use a keyboard if you can.</p>
    <p id="status" class="muted">Loading images…</p><div class="bar"><div id="pbar"></div></div>
    <button class="primary" id="go" disabled>Start</button></div>`);
  document.getElementById("pbar").style.width = (100*progress.done/progress.total)+"%";
  await preloadPromise;
  const st = document.getElementById("status");
  if (missing.length && !DEV) {
    st.className = "warn"; st.innerHTML = `${missing.length} image file(s) could not be loaded (e.g. ${missing.slice(0,5).join(", ")}). The task cannot start. Please contact the researcher.`;
    return new Promise(()=>{});
  }
  st.textContent = "Images loaded."; document.getElementById("go").disabled = false;
  await waitClick("go");
}

function restScreen(msg){
  show(`<div class="text"><h1>Rest</h1><p>${msg}</p><button class="primary" id="go">Continue</button></div>`);
  return waitClick("go");
}

function trialScreen(){
  show(`<div id="trial"><div id="stage"></div><div id="buttons">${
    KEY_ORDER.map((c,i)=>`<button data-emo="${c}">${EMO[c]}<small>${CONFIG.KEYS[i].toUpperCase()}</small></button>`).join("")}</div></div>`);
}

function getResponse(){
  return new Promise(resolve => {
    let t0 = null, done = false, timer = null;
    const finish = (emo, via) => {
      if (done || t0 === null) return; done = true;
      const rt = performance.now() - t0;
      document.removeEventListener("keydown", onKey); btnBox.removeEventListener("pointerdown", onBtn); clearTimeout(timer);
      resolve({ emo, rt, via });
    };
    const onKey = e => { if (e.repeat) return; const i = CONFIG.KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) finish(KEY_ORDER[i], "key"); };
    const onBtn = e => { const b = e.target.closest("button[data-emo]"); if (b) finish(b.dataset.emo, "click"); };
    const btnBox = document.getElementById("buttons");
    document.addEventListener("keydown", onKey); btnBox.addEventListener("pointerdown", onBtn);
    requestAnimationFrame(() => { t0 = performance.now(); if (CONFIG.MAX_RT_MS) timer = setTimeout(() => finish(null, "timeout"), CONFIG.MAX_RT_MS); });
  });
}

async function runBlock(agent, blockNo){
  const trials = shuffle(makeStimuli(agent));
  trialScreen();
  const stage = document.getElementById("stage");
  const fix = document.createElement("div"); fix.id = "fix"; fix.textContent = "+";
  for (let i=0; i<trials.length; i++) {
    if (i > 0 && i % CONFIG.BREAK_EVERY === 0) { await restScreen("Take a short break. Continue when you are ready."); trialScreen(); }
    const t = trials[i], st = document.getElementById("stage");
    st.replaceChildren(fix.cloneNode(true)); await sleep(CONFIG.FIXATION_MS);
    const img = imgCache[t.file]; img.className = "stim"; st.replaceChildren(img);
    const r = await getResponse();
    const shown = { w: img.clientWidth, h: img.clientHeight };
    st.replaceChildren(); await sleep(CONFIG.ITI_MS);
    data.trials.push({
      pid:PID, block:blockNo, trial_in_block:i+1, agent, file:t.file,
      body_emotion:EMO[t.body], face_emotion:EMO[t.face], rep:t.rep, congruency: t.congruent ? "congruent" : "incongruent",
      response: r.emo ? EMO[r.emo] : "", correct: r.emo ? (r.emo === t.face ? 1 : 0) : "",
      body_match: (!t.congruent && r.emo) ? (r.emo === t.body ? 1 : 0) : "",
      rt_ms: Math.round(r.rt*10)/10, response_via:r.via, img_shown_px:`${shown.w}x${shown.h}`, timestamp:new Date().toISOString()
    });
  }
}

async function trustRatings(){
  const order = shuffle(["robot","human"]); data.trustOrder = order;
  for (const agent of order) {
    const im = imgCache[CONFIG.NEUTRAL[agent]]; im.className = "";
    show(`<div class="text rate"><div id="slot"></div><p style="text-align:center"><strong>How trustworthy does this face look?</strong></p>
      <div class="scale">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div>
      <div class="ends"><span>1 = not at all trustworthy</span><span>9 = extremely trustworthy</span></div></div>`);
    document.getElementById("slot").appendChild(im);
    data.trust[agent] = await new Promise(res => document.querySelector(".scale").addEventListener("click", e => { const b = e.target.closest("button[data-n]"); if (b) res(+b.dataset.n); }));
  }
}

const IRI_ITEMS = [
  [2,"EC",0,`I often have tender, concerned feelings for people less fortunate than me.`],
  [3,"PT",1,`I sometimes find it difficult to see things from the "other guy's" point of view.`],
  [4,"EC",1,`Sometimes I don't feel very sorry for other people when they are having problems.`],
  [8,"PT",0,`I try to look at everybody's side of a disagreement before I make a decision.`],
  [9,"EC",0,`When I see someone being taken advantage of, I feel kind of protective towards them.`],
  [11,"PT",0,`I sometimes try to understand my friends better by imagining how things look from their perspective.`],
  [14,"EC",1,`Other people's misfortunes do not usually disturb me a great deal.`],
  [15,"PT",1,`If I'm sure I'm right about something, I don't waste much time listening to other people's arguments.`],
  [18,"EC",1,`When I see someone being treated unfairly, I sometimes don't feel very much pity for them.`],
  [20,"EC",0,`I am often quite touched by things that I see happen.`],
  [21,"PT",0,`I believe that there are two sides to every question and try to look at them both.`],
  [22,"EC",0,`I would describe myself as a pretty soft-hearted person.`],
  [25,"PT",0,`When I'm upset at someone, I usually try to "put myself in his shoes" for a while.`],
  [28,"PT",0,`Before criticizing somebody, I try to imagine how I would feel if I were in their place.`]
];
async function iri(){
  show(`<div class="text"><h1>Questionnaire</h1><p>Indicate how well each statement describes you, from 0 (does not describe me well) to 4 (describes me very well).</p>
    ${IRI_ITEMS.map(([n,,,txt])=>`<div class="iri-item"><p>${txt.replace(/"/g,"&quot;")}</p><div class="iri-opts">${[0,1,2,3,4].map(v=>`<label><input type="radio" name="i${n}" value="${v}"> ${v}</label>`).join("")}</div></div>`).join("")}
    <p id="err" class="warn"></p><button class="primary" id="go">Finish</button></div>`);
  while (true) {
    await waitClick("go");
    const missingItems = IRI_ITEMS.filter(([n]) => !document.querySelector(`input[name=i${n}]:checked`));
    if (!missingItems.length) break;
    document.getElementById("err").textContent = "Please answer every statement.";
  }
  let ec = 0, pt = 0;
  for (const [n, sub, rev] of IRI_ITEMS) {
    const raw = +document.querySelector(`input[name=i${n}]:checked`).value; data.iri[n] = raw;
    const sc = rev ? 4 - raw : raw; if (sub === "EC") ec += sc; else pt += sc;
  }
  data.iri_EC = ec; data.iri_PT = pt;
}

/* ============================ DATA OUT ============================ */
function toCSV(rows){
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}
function summaryRow(){
  const row = { ...data.meta, finished:new Date().toISOString(), trust_order:data.trustOrder.join(">"), trust_robot:data.trust.robot, trust_human:data.trust.human, iri_EC:data.iri_EC, iri_PT:data.iri_PT };
  for (const [n] of IRI_ITEMS) row["iri_item_"+n] = data.iri[n];
  return row;
}
function download(name, text){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type:"text/csv" })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function pipeUpload(filename, text){
  const r = await fetch("https://pipe.jspsych.org/api/data/", {
    method:"POST", headers:{ "Content-Type":"application/json", Accept:"*/*" },
    body: JSON.stringify({ experimentID: CONFIG.DATAPIPE_ID, filename, data: text })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || (j.error && j.error !== "")) throw new Error(j.message || j.error || ("HTTP " + r.status));
}
async function saveData(trialsCSV, summaryCSV){
  if (!CONFIG.DATAPIPE_ID) return "download";
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      await pipeUpload(`${PID}_trials.csv`, trialsCSV);
      await pipeUpload(`${PID}_questionnaires.csv`, summaryCSV);
      return "saved";
    } catch (e) {
      console.error("Upload attempt " + attempt + " failed:", e);
      if (String(e.message).includes("exists")) return "saved";   // file already uploaded on an earlier attempt
      await sleep(1500 * attempt);
    }
  }
  return "failed";
}

async function finish(){
  const trialsCSV = toCSV(data.trials), summaryCSV = toCSV([summaryRow()]);
  show(`<div class="text"><h1>Saving…</h1><p>Please wait and do not close this window.</p></div>`);
  const status = await saveData(trialsCSV, summaryCSV);
  if (status === "saved") {
    show(`<div class="text"><h1>Thank you</h1><p>Your responses have been saved. You can close this window now.</p></div>`);
    return;
  }
  const msg = status === "failed"
    ? `<p class="warn">Your data could not be uploaded automatically. Please download both files below and send them to the researcher.</p>`
    : `<p class="muted">Pilot version: download both files and send them to the researcher.</p>`;
  show(`<div class="text"><h1>Thank you</h1><p>The task is complete.</p>${msg}
    <p><button class="primary" id="d1">Download trial data</button> <button id="d2">Download questionnaire data</button></p></div>`);
  document.getElementById("d1").onclick = () => download(`${PID}_trials.csv`, trialsCSV);
  document.getElementById("d2").onclick = () => download(`${PID}_questionnaires.csv`, summaryCSV);
}

/* ============================ FLOW ============================ */
(async function main(){
  await consent();
  await instructions();
  for (let b=0; b<AGENT_ORDER.length; b++) {
    if (b > 0) await restScreen("Part 1 is finished. Take a short break. The figures in Part 2 look different, but the task is the same: report the emotion shown by the face.");
    await runBlock(AGENT_ORDER[b], b+1);
  }
  await restScreen("The task is finished. Next you will rate two faces and answer a short questionnaire.");
  await trustRatings();
  await iri();
  await finish();
})();
</script>
</body>
</html>
